[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "transport-shipment-etl"
version = "0.1.0"
description = "Transportation shipment ETL pipeline using PySpark, Spark SQL, curated Hive-style outputs, and EMR deployment artifacts"
readme = "README.md"
requires-python = ">=3.10"
authors = [{ name = "Transportation Data Engineering Team" }]
dependencies = [
  "PyYAML==6.0.2",
  "python-dateutil==2.9.0.post0",
  "numpy==1.26.4",
  "pandas==2.2.3",
  "scikit-learn==1.5.2",
]

[project.optional-dependencies]
spark = [
  "pyspark==3.5.2",
]
data-quality = [
  "pytest==8.3.5",
]
aws = [
  "boto3==1.35.99",
]
dev = [
  "pyspark==3.5.2",
  "pytest==8.3.5",
  "pytest-cov==6.0.0",
  "black==24.10.0",
  "ruff==0.11.0",
]

[project.scripts]
transport-etl = "transport_etl.main:main"
transport-etl-ml = "transport_etl.ml.cli:main"
transport-etl-data-quality = "transport_etl.jobs.run_data_quality:databricks_main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

[tool.black]
line-length = 100
target-version = ["py310"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I"]

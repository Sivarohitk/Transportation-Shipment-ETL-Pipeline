# Development target overrides. Values remain maps because that is the target
# variable shape accepted by the installed Databricks CLI schema.
targets:
  dev:
    variables:
      environment:
        default: dev
      catalog_name:
        default: workspace
      bronze_schema:
        default: bronze_dev
      silver_schema:
        default: silver_dev
      gold_schema:
        default: gold_dev
      file_schema:
        default: default
      volume_name:
        default: transport_etl

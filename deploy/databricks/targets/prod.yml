# Production target overrides. The catalog, schemas, and Volume must already
# exist; bundle validation and deployment do not provision them.
targets:
  prod:
    variables:
      environment:
        default: prod
      catalog_name:
        default: workspace
      bronze_schema:
        default: bronze
      silver_schema:
        default: silver
      gold_schema:
        default: gold
      file_schema:
        default: default
      volume_name:
        default: transport_etl

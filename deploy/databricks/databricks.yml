# Databricks Declarative Automation Bundle for the transport ETL pipeline.
# The workspace host and OAuth credentials are supplied by the selected CLI
# profile and are intentionally absent from this repository.

bundle:
  name: transport_etl_bundle
  uuid: 2f3a8c1d-4e5b-4a2f-9c8d-1a2b3c4d5e6f

# Include only bundle configuration fragments. Application files are handled
# by the wheel artifact or the sync configuration below.
include:
  - resources/*.yml
  - targets/*.yml

# These external directories make the repository root the synchronization
# root. Python application code is delivered in the wheel rather than synced.
sync:
  paths:
    - ../../config
    - ../../data/sample
    - ../../sql/staging
    - ../../tests

# Artifact.path is evaluated from deploy/databricks, so ../.. is the actual
# Python project root containing pyproject.toml. The explicit files entry tells
# the current CLI which wheel the artifact build produces.
artifacts:
  python_wheel:
    type: whl
    path: ../..
    build: python -m pip wheel --no-deps --wheel-dir deploy/databricks/dist .
    files:
      - source: dist/transport_shipment_etl-0.1.0-py3-none-any.whl

variables:
  etl_entry_point:
    default: transport-etl
  ml_entry_point:
    default: transport-etl-ml
  dq_entry_point:
    default: transport-etl-data-quality
  environment:
    default: dev
  catalog_name:
    description: Existing Unity Catalog catalog used by managed Delta tables.
    default: workspace
  bronze_schema:
    description: Existing schema for Bronze managed tables.
    default: bronze_dev
  silver_schema:
    description: Existing schema for Silver managed tables.
    default: silver_dev
  gold_schema:
    description: Existing schema for Gold managed tables.
    default: gold_dev
  file_schema:
    description: Existing schema containing the input Unity Catalog Volume.
    default: default
  volume_name:
    description: Existing Unity Catalog Volume for input, quarantine, and ML files.
    default: transport_etl
  raw_base_path:
    default: /Volumes/${var.catalog_name}/${var.file_schema}/${var.volume_name}/raw
  reference_base_path:
    default: /Volumes/${var.catalog_name}/${var.file_schema}/${var.volume_name}/reference
  staging_base_path:
    default: /Volumes/${var.catalog_name}/${var.file_schema}/${var.volume_name}/staging
  curated_base_path:
    description: Compatibility path; managed Delta table writers do not use it.
    default: /Volumes/${var.catalog_name}/${var.file_schema}/${var.volume_name}/curated
  audit_base_path:
    default: /Volumes/${var.catalog_name}/${var.file_schema}/${var.volume_name}/audit
  ml_shipments_path:
    description: CSV input for the existing file-based late-risk CLI.
    default: /Volumes/${var.catalog_name}/${var.file_schema}/${var.volume_name}/ml/shipments.csv
  ml_decision_threshold:
    default: "0.25"

targets:
  dev:
    default: true
    mode: development
  prod:
    mode: production

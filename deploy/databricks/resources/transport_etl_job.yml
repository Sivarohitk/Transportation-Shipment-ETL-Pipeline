resources:
  jobs:
    transport_etl_job:
      name: "transport-etl-${bundle.target}"
      description: >-
        Bronze, Silver, and Gold shipment processing, late-risk scoring,
        and data-quality checks using the repository's Python wheel.
      max_concurrent_runs: 1
      performance_target: STANDARD
      schedule:
        quartz_cron_expression: "0 0 6 * * ?"
        timezone_id: UTC
        pause_status: PAUSED
      parameters:
        - name: run_date
          default: ""
      tags:
        project: transport_etl
        environment: "${var.environment}"
        compute: serverless

      # Python wheel tasks require an environment_key when no classic cluster
      # is declared. Environment version 4 is supported by the current CLI
      # schema. Free Edition serverless requires all libraries, including the
      # bundle wheel, to be declared on the shared environment.
      environments:
        - environment_key: serverless
          spec:
            environment_version: "4"
            dependencies:
              - ../dist/transport_shipment_etl-0.1.0-py3-none-any.whl
              - pytest==8.3.5

      tasks:
        - task_key: ingest_bronze_silver_gold
          description: Run the existing daily Bronze/Silver/Gold pipeline.
          environment_key: serverless
          timeout_seconds: 3600
          python_wheel_task:
            package_name: transport_shipment_etl
            entry_point: "${var.etl_entry_point}"
            parameters:
              - --config
              - "${workspace.file_path}/config/databricks.yaml"
              - --config-dir
              - "${workspace.file_path}/config"
              - --job
              - daily
              - --run-date
              - "{{job.parameters.run_date}}"
              - --raw-base-path
              - "${var.raw_base_path}"
              - --reference-base-path
              - "${var.reference_base_path}"
              - --staging-base-path
              - "${var.staging_base_path}"
              - --curated-base-path
              - "${var.curated_base_path}"
              - --resource-base-path
              - "${workspace.file_path}"
              - --catalog
              - "${var.catalog_name}"
              - --bronze-schema
              - "${var.bronze_schema}"
              - --silver-schema
              - "${var.silver_schema}"
              - --gold-schema
              - "${var.gold_schema}"
              - --no-register-hive
              - --raise-on-error
        - task_key: score_late_risk
          description: Run the existing chronological late-risk model pipeline.
          depends_on:
            - task_key: ingest_bronze_silver_gold
          environment_key: serverless
          timeout_seconds: 1800
          python_wheel_task:
            package_name: transport_shipment_etl
            entry_point: "${var.ml_entry_point}"
            parameters:
              - train-and-score
              - --shipments
              - "${var.ml_shipments_path}"
              - --output-dir
              - "${var.audit_base_path}/ml"
              - --model
              - logistic_regression
              - --decision-threshold
              - "${var.ml_decision_threshold}"
        - task_key: data_quality_checks
          description: Run the existing data-quality test suite without notebook copies.
          depends_on:
            - task_key: ingest_bronze_silver_gold
            - task_key: score_late_risk
          environment_key: serverless
          timeout_seconds: 1800
          python_wheel_task:
            package_name: transport_shipment_etl
            entry_point: "${var.dq_entry_point}"
            parameters:
              - --target
              - "${bundle.target}"
              - --test-dir
              - "${workspace.file_path}/tests/data_quality"
              - --resource-base-path
              - "${workspace.file_path}"
              - --quarantine-base-path
              - "${var.audit_base_path}/data_quality/quarantine"

app:
  name: transport-shipment-etl
  env: base
  timezone: UTC

runtime:
  default_write_mode: overwrite
  fail_fast: true

# File-manifest checkpoints. Disabled in the shared base so existing custom
# and Databricks profiles retain their current behavior unless opted in.
pipeline_state:
  enabled: false
  backend: auto
  # Empty uses paths.audit_base_path/pipeline_state.
  root_path: ""

paths:
  raw_base_path: data/sample/raw
  staging_base_path: data/local/staging
  curated_base_path: data/local/curated
  audit_base_path: data/local/logs
  reference_base_path: data/sample/reference

spark:
  profile: local
  app_name: transport-shipment-etl
  enable_hive_support: true
  conf:
    spark.sql.session.timeZone: UTC
    spark.sql.adaptive.enabled: "true"
    spark.sql.sources.partitionOverwriteMode: dynamic
    spark.sql.parquet.compression.codec: snappy
    spark.sql.shuffle.partitions: "8"

io:
  csv:
    header: "true"
    inferSchema: "false"
    mode: PERMISSIVE
    timestampFormat: "yyyy-MM-dd'T'HH:mm:ssX"
  parquet:
    compression: snappy
  invalid_records:
    format: parquet
    windows_local_fallback_enabled: false
    windows_local_fallback_format: json
  curated_outputs:
    format: parquet
    windows_local_fallback_enabled: false
    windows_local_fallback_format: json

hive:
  database: curated
  mode: overwrite
  register_tables: true
  repair_partitions: true

# Optional downstream warehouse publication. Local and test runs remain
# dependency- and credential-free while this is disabled.
redshift:
  enabled: false
  region: ""
  database: ""
  workgroup_name: ""
  cluster_identifier: ""
  secret_arn: ""
  database_user: ""
  iam_role_arn: ""
  source_s3_path: ""
  staging_schema: transport_staging
  target_schema: transport_analytics
  audit_schema: transport_audit
  poll_interval_seconds: 2
  timeout_seconds: 900

# Optional AWS Glue Data Catalog metadata for the five core S3 Gold tables.
# This is separate from Spark's existing Hive registration.
glue:
  enabled: false
  region: ""
  database: ""
  catalog_id: ""
  update_existing_tables: true
  register_partitions: true
  failure_policy: fail

partitioning:
  keys:
    - p_date
    - region_code
    - carrier_id

logging:
  level: INFO
  logger_name: transport_etl
  json: false

quality:
  fail_on_schema_drift: true
  # Multiple updates for a business key are expected within a batch; Silver
  # resolves them deterministically and quarantines superseded rows.
  fail_on_duplicate_primary_keys: false
  fail_on_required_nulls: true

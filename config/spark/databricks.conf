# Databricks Spark profile
# This file is loaded by common/spark.py when spark.profile = databricks.
#
# On Databricks the cluster already provides an active SparkSession and
# configures most runtime settings (executor memory, autoscaling, etc.)
# at the cluster level.  Only settings that must be applied at the
# application level are listed here.
#
# Do NOT add credentials, workspace URLs, tokens, or account IDs here.
spark.sql.session.timeZone=UTC
spark.sql.adaptive.enabled=true
spark.sql.sources.partitionOverwriteMode=dynamic
spark.sql.parquet.compression.codec=snappy

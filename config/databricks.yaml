app:
  env: databricks

runtime:
  fail_fast: true

spark:
  profile: databricks
  app_name: supply-chain-lakehouse
  enable_hive_support: false
  conf:
    spark.sql.shuffle.partitions: "200"
    spark.sql.adaptive.enabled: "true"
    spark.sql.sources.partitionOverwriteMode: dynamic
    spark.sql.session.timeZone: UTC

# File-based inputs, quarantine records, audit output, and the existing ML CLI
# use a Unity Catalog Volume. The bundle supplies target-specific overrides.
# The catalog/schema/Volume must already exist; Phase 9.1 does not provision it.
paths:
  raw_base_path: /Volumes/workspace/default/transport_etl/raw
  staging_base_path: /Volumes/workspace/default/transport_etl/staging
  curated_base_path: /Volumes/workspace/default/transport_etl/curated
  audit_base_path: /Volumes/workspace/default/transport_etl/audit
  reference_base_path: /Volumes/workspace/default/transport_etl/reference

# Bronze, Silver, and Gold are managed Delta tables. Bundle task arguments can
# override every identifier without changing this file.
unity_catalog:
  catalog: workspace
  bronze_schema: bronze_dev
  silver_schema: silver_dev
  gold_schema: gold_dev

io:
  curated_outputs:
    format: delta

hive:
  register_tables: false
  repair_partitions: false

logging:
  level: INFO
  json: true
